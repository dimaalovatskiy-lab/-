<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Алгебра та геометрія — конспект до іспиту</title>
<script>
window.MathJax = {
  tex: {inlineMath: [['\\(','\\)']], displayMath: [['\\[','\\]']], processEscapes: true},
  options: {skipHtmlTags: ['script','noscript','style','textarea','pre','code']}
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #2457a7;
    --accent-light: #eef3fc;
    --border: #dce2ec;
    --danger: #ef4444;
    --success: #10b981;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.68;
    font-size: 16px;
  }
  header {
    background: #172b4d;
    color: white;
    padding: 18px 20px 16px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
  header p { margin: 3px 0 0; font-size: .8rem; opacity: .85; }

  .toolbar {
    max-width: 900px;
    margin: 0 auto;
    padding: 12px 20px 0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  #search {
    flex: 1;
    min-width: 200px;
    padding: 11px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: .95rem;
    outline: none;
    background: white;
    transition: border-color .15s;
  }
  #search:focus { border-color: var(--accent); }
  .btn-print {
    padding: 11px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: white;
    cursor: pointer;
    font-size: .9rem;
    white-space: nowrap;
  }
  .btn-print:hover { background: var(--accent-light); }

  .progress-wrap {
    max-width: 900px;
    margin: 10px auto 0;
    padding: 0 20px;
  }
  .progress-bar {
    background: var(--border);
    border-radius: 8px;
    height: 6px;
    overflow: hidden;
  }
  .progress-bar > div {
    height: 100%;
    background: var(--success);
    width: 0%;
    transition: width .3s;
  }
  .stats { font-size: .75rem; color: var(--muted); margin-top: 4px; }

  .container { max-width: 900px; margin: 0 auto; padding: 16px 20px 80px; }

  .topic {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .topic-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
  }
  .topic-header:hover { background: var(--accent-light); }
  .topic-title { flex: 1; font-weight: 600; font-size: 1rem; }
  .chevron { transition: transform .2s; color: var(--muted); }
  .topic.open .chevron { transform: rotate(90deg); }

  .notes { display: none; border-top: 1px solid var(--border); }
  .topic.open .notes { display: block; }

  .note { padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .note:last-child { border-bottom: none; }
  .note h3 {
    margin: 0 0 8px;
    font-size: .98rem;
    color: var(--accent);
  }
  .note .note-body { font-size: .93rem; }
  .note .note-body p { margin: 8px 0; }
  .note .note-body ul, .note .note-body ol { padding-left: 24px; margin: 8px 0; }
  .note .note-body li { margin: 4px 0; }
  .note .note-body mark { background: #fde68a; padding: 0 2px; border-radius: 3px; }

  /* Стилі з твого конспекту */
  .math {
    overflow-x: auto;
    background: var(--accent-light);
    border-left: 4px solid var(--accent);
    padding: 10px 14px;
    margin: 12px 0;
    border-radius: 7px;
  }
  .note-body .def {
    background: #f2f7f3;
    border-left: 4px solid #43845a;
    padding: 10px 14px;
    border-radius: 7px;
    margin: 12px 0;
  }
  .note-body .note {
    background: #fff8e8;
    border-left: 4px solid #d69a24;
    padding: 10px 14px;
    border-radius: 7px;
    margin: 12px 0;
    border-bottom: none;
  }
  .note-body table {
    border-collapse: collapse;
    width: 100%;
    margin: 12px 0;
  }
  .note-body th, .note-body td {
    border: 1px solid var(--border);
    padding: 8px 10px;
    text-align: left;
    vertical-align: top;
  }
  .note-body th { background: var(--accent-light); }

  .note-del {
    float: right;
    background: none;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: .8rem;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .note-del:hover { background: #fee2e2; }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    font-size: .9rem;
  }

  .fab {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    border: none;
    font-size: 1.6rem;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(36,87,167,.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }
  .fab:active { transform: scale(.95); }

  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: white;
    border-radius: 14px;
    width: 100%;
    max-width: 520px;
    padding: 20px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 { margin: 0 0 14px; font-size: 1.05rem; }
  .modal input, .modal textarea, .modal select {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: .9rem;
    font-family: inherit;
    outline: none;
  }
  .modal textarea { min-height: 180px; resize: vertical; font-family: monospace; }
  .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .btn {
    padding: 9px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: white;
    font-size: .9rem;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn:active { transform: scale(.97); }

  @media (max-width: 650px) {
    body { font-size: 15px; }
    .container { padding: 12px 14px 80px; }
    .toolbar { padding: 10px 14px 0; }
    .progress-wrap { padding: 0 14px; }
    .note { padding: 12px 14px; }
  }
  @media print {
    header, .toolbar, .progress-wrap, .fab, .note-del { display: none !important; }
    body { background: white; }
    .topic { break-inside: avoid; border: 1px solid #ccc; }
    .notes { display: block !important; }
    .topic-header { cursor: default; }
    .note-body { font-size: 11pt; }
  }
</style>
</head>
<body>

<header>
  <h1>📐 Алгебра та геометрія</h1>
  <p>Повний конспект для підготовки до іспиту · 1 курс, 1 семестр</p>
</header>

<div class="toolbar">
  <input id="search" type="search" placeholder="🔍 Пошук за темами, формулами, текстом...">
  <button class="btn-print" id="printBtn" title="Роздрукувати або зберегти в PDF">🖨️ Друк</button>
</div>

<div class="progress-wrap">
  <div class="progress-bar"><div id="progressFill"></div></div>
  <div class="stats" id="stats">Завантаження...</div>
</div>

<div class="container" id="container"></div>

<button class="fab" id="fab" title="Додати свій конспект">+</button>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2>Додати свій конспект</h2>
    <select id="topicSelect"></select>
    <input id="noteTitle" placeholder="Заголовок конспекту">
    <textarea id="noteBody" placeholder="Текст конспекту. Можна використовувати HTML і формули: \(...\) або \[...\]"></textarea>
    <div class="modal-actions">
      <button class="btn" id="cancelBtn">Скасувати</button>
      <button class="btn btn-primary" id="saveBtn">Зберегти</button>
    </div>
  </div>
</div>

<script>
/* ================= ДАНІ КОНСПЕКТУ =================
   Кожна тема: { topic: "Назва", notes: [ { title, html } ] }
   html — це готовий HTML-рядок з формулами MathJax.
==================================================== */
const DEFAULT_DATA = [
  {
    topic: "1. Афінна система координат. Метод координат",
    notes: [{
      title: "Афінна система координат",
      html: `<div class="def"><b>Афінна система координат</b> у просторі задається початком \\(O\\) та впорядкованим базисом векторів \\(\\vec e_1,\\vec e_2,\\vec e_3\\). Будь-яка точка \\(M\\) має радіус-вектор \\(\\overrightarrow{OM}\\).</div>
<p>Координати точки \\(M(x_1,x_2,x_3)\\) визначаються рівністю</p>
<div class="math">\\[\\overrightarrow{OM}=x_1\\vec e_1+x_2\\vec e_2+x_3\\vec e_3.\\]</div>
<p>У двовимірному випадку використовують два базисні вектори. Координати вектора \\(\\vec a\\) — це коефіцієнти його розкладу за базисом:</p>
<div class="math">\\[\\vec a=a_1\\vec e_1+a_2\\vec e_2+a_3\\vec e_3.\\]</div>
<p>Якщо \\(A(x_1,y_1,z_1)\\), \\(B(x_2,y_2,z_2)\\), то</p>
<div class="math">\\[\\overrightarrow{AB}=(x_2-x_1,\\ y_2-y_1,\\ z_2-z_1).\\]</div>
<p>Середина відрізка \\(AB\\):</p>
<div class="math">\\[M\\left(\\frac{x_1+x_2}{2},\\frac{y_1+y_2}{2},\\frac{z_1+z_2}{2}\\right).\\]</div>
<p>Метод координат полягає в тому, що геометричні об'єкти та співвідношення між ними переводять у рівняння й обчислення з координатами. Афінні координати самі по собі не задають довжин і кутів: для цього потрібна додаткова структура скалярного добутку.</p>`
    }]
  },
  {
    topic: "2. Скалярний добуток та його властивості",
    notes: [{
      title: "Скалярний добуток",
      html: `<div class="def">Скалярним добутком векторів \\(\\vec a,\\vec b\\) називається число
<div class="math">\\[\\vec a\\cdot\\vec b=|\\vec a|\\,|\\vec b|\\cos\\varphi,\\]</div>
де \\(\\varphi\\) — кут між векторами.</div>
<p>Основні властивості:</p>
<ul>
<li>симетричність: \\(\\vec a\\cdot\\vec b=\\vec b\\cdot\\vec a\\);</li>
<li>лінійність: \\((\\vec a+\\vec b)\\cdot\\vec c=\\vec a\\cdot\\vec c+\\vec b\\cdot\\vec c\\);</li>
<li>\\((\\lambda\\vec a)\\cdot\\vec b=\\lambda(\\vec a\\cdot\\vec b)\\);</li>
<li>додатна визначеність: \\(\\vec a\\cdot\\vec a=|\\vec a|^2\\geq0\\), причому рівність нулю можлива лише для \\(\\vec a=\\vec0\\).</li>
</ul>
<p>Якщо \\(\\vec a=(a_1,a_2,a_3)\\), \\(\\vec b=(b_1,b_2,b_3)\\) в ортонормованому базисі, то</p>
<div class="math">\\[\\boxed{\\vec a\\cdot\\vec b=a_1b_1+a_2b_2+a_3b_3.}\\]</div>
<p>Звідси \\(|\\vec a|=\\sqrt{a_1^2+a_2^2+a_3^2}\\), а для ненульових векторів</p>
<div class="math">\\[\\cos\\varphi=\\frac{\\vec a\\cdot\\vec b}{|\\vec a||\\vec b|}.\\]</div>
<p>Вектори перпендикулярні тоді й тільки тоді, коли \\(\\vec a\\cdot\\vec b=0\\).</p>
<p><b>Теорема про координатне обчислення.</b> У ортонормованому базисі скалярний добуток дорівнює сумі попарних добутків відповідних координат. Доведення: розкласти обидва вектори за базисом, застосувати білінійність і врахувати \\(\\vec e_i\\cdot\\vec e_j=0\\) при \\(i\\ne j\\), \\(\\vec e_i\\cdot\\vec e_i=1\\).</p>`
    }]
  },
  {
    topic: "3. Проєкція точки та вектора на пряму, площину, вісь",
    notes: [{
      title: "Проєкції",
      html: `<p>Ортогональна проєкція — результат опускання перпендикуляра на задану пряму або площину. Для вектора \\(\\vec a\\) та одиничного напрямного вектора \\(\\vec e\\) скалярна проєкція на вісь:</p>
<div class="math">\\[\\operatorname{pr}_{\\vec e}\\vec a=\\vec a\\cdot\\vec e=|\\vec a|\\cos\\varphi.\\]</div>
<p>Векторна проєкція:</p>
<div class="math">\\[\\operatorname{proj}_{\\vec e}\\vec a=(\\vec a\\cdot\\vec e)\\vec e.\\]</div>
<p>Якщо напрямний вектор \\(\\vec d\\ne0\\), то</p>
<div class="math">\\[\\operatorname{proj}_{\\vec d}\\vec a=\\frac{\\vec a\\cdot\\vec d}{\\vec d\\cdot\\vec d}\\vec d.\\]</div>
<p>Для площини з одиничною нормаллю \\(\\vec n\\) нормальна складова вектора дорівнює \\((\\vec a\\cdot\\vec n)\\vec n\\), а проєкція на площину:</p>
<div class="math">\\[\\vec a_{\\text{пл}}=\\vec a-(\\vec a\\cdot\\vec n)\\vec n.\\]</div>
<p>Проєкція точки на пряму/площину визначається як точка перетину об'єкта з перпендикуляром, проведеним із заданої точки.</p>`
    }]
  },
  {
    topic: "4. Нормальні рівняння прямої та площини",
    notes: [{
      title: "Нормальні рівняння",
      html: `<p>Нормальне рівняння площини має вигляд</p>
<div class="math">\\[x\\cos\\alpha+y\\cos\\beta+z\\cos\\gamma-p=0,\\]</div>
<p>де \\((\\cos\\alpha,\\cos\\beta,\\cos\\gamma)\\) — координати одиничного нормального вектора, а \\(p\\) — відстань від початку координат до площини.</p>
<p>Для загального рівняння \\(Ax+By+Cz+D=0\\) нормувальний множник:</p>
<div class="math">\\[\\mu=\\frac{1}{\\sqrt{A^2+B^2+C^2}}.\\]</div>
<p>Помноживши рівняння на \\(\\mu\\) або \\(-\\mu\\), дістаємо нормальну форму з узгодженим знаком вільного члена.</p>
<p>Для прямої на площині \\(Ax+By+C=0\\):</p>
<div class="math">\\[x\\cos\\alpha+y\\sin\\alpha-p=0,\\qquad \\cos\\alpha=\\frac{A}{\\sqrt{A^2+B^2}},\\quad \\sin\\alpha=\\frac{B}{\\sqrt{A^2+B^2}}.\\]</div>
<p>Відстань від точки \\(M_0(x_0,y_0,z_0)\\) до площини:</p>
<div class="math">\\[d=\\frac{|Ax_0+By_0+Cz_0+D|}{\\sqrt{A^2+B^2+C^2}}.\\]</div>`
    }]
  },
  {
    topic: "5. Мішаний добуток та його властивості",
    notes: [{
      title: "Мішаний добуток",
      html: `<p>Мішаний добуток трьох векторів:</p>
<div class="math">\\[[\\vec a,\\vec b,\\vec c]=(\\vec a\\times\\vec b)\\cdot\\vec c.\\]</div>
<p>У координатах:</p>
<div class="math">\\[[\\vec a,\\vec b,\\vec c]=\\begin{vmatrix}a_1&a_2&a_3\\\\b_1&b_2&b_3\\\\c_1&c_2&c_3\\end{vmatrix}.\\]</div>
<p>Властивості: циклічна перестановка не змінює значення; перестановка двох векторів змінює знак; добуток лінійний за кожним аргументом; він дорівнює нулю тоді й тільки тоді, коли вектори компланарні (лінійно залежні).</p>
<p><b>Теорема про об'єм паралелепіпеда.</b> Об'єм паралелепіпеда, побудованого на \\(\\vec a,\\vec b,\\vec c\\), дорівнює</p>
<div class="math">\\[V=|[\\vec a,\\vec b,\\vec c]|.\\]</div>
<p>Пояснення: \\(|\\vec a\\times\\vec b|\\) — площа основи, а множення на модуль проєкції \\(\\vec c\\) на нормаль до основи дає висоту. Отже, добуток є об'ємом; модуль усуває залежність від орієнтації.</p>`
    }]
  },
  {
    topic: "6. Канонічні рівняння еліпса та параболи. Властивості еліпса",
    notes: [{
      title: "Еліпс і парабола",
      html: `<p><b>Еліпс</b> — множина точок, сума відстаней від яких до двох фокусів стала і дорівнює \\(2a\\). За \\(a\\ge b>0\\):</p>
<div class="math">\\[\\boxed{\\frac{x^2}{a^2}+\\frac{y^2}{b^2}=1.}\\]</div>
<p>Фокуси \\(F_1(-c,0)\\), \\(F_2(c,0)\\), де \\(c^2=a^2-b^2\\). Ексцентриситет \\(e=c/a\\), тому \\(0\\le e<1\\). Вершини: \\((\\pm a,0)\\), \\((0,\\pm b)\\). Осі симетрії — координатні осі; центр — початок координат.</p>
<p><b>Виведення.</b> Для точки \\(M(x,y)\\) сума відстаней до фокусів:</p>
<div class="math">\\[\\sqrt{(x-c)^2+y^2}+\\sqrt{(x+c)^2+y^2}=2a.\\]</div>
<p>Послідовне ізолювання одного кореня та піднесення до квадрата (двічі) дає \\(x^2/a^2+y^2/b^2=1\\), де \\(b^2=a^2-c^2\\).</p>
<p><b>Парабола</b> — множина точок, рівновіддалених від фокуса й директриси. Для фокуса \\(F(p/2,0)\\) і директриси \\(x=-p/2\\):</p>
<div class="math">\\[\\sqrt{(x-p/2)^2+y^2}=|x+p/2|.\\]</div>
<p>Після піднесення до квадрата:</p>
<div class="math">\\[\\boxed{y^2=2px.}\\]</div>
<p>Вісь параболи — вісь \\(Ox\\), вершина — \\(O\\); напрям відкриття визначається знаком \\(p\\). Для стандартної форми \\(y^2=2px\\), фокус \\((p/2,0)\\), директриса \\(x=-p/2\\).</p>`
    }]
  },
  {
    topic: "7. Ексцентриситет, директриса, спряжений діаметр",
    notes: [{
      title: "Ексцентриситет і директриса",
      html: `<p>Ексцентриситет характеризує форму конічного перерізу. Для еліпса \\(e=c/a<1\\), для параболи \\(e=1\\), для гіперболи \\(e>1\\). Директриса — пряма, що входить у фокусно-директрисне означення коніки: для точки \\(M\\) відношення відстані до фокуса до відстані до директриси є сталим і дорівнює \\(e\\).</p>
<p>Для еліпса \\(x^2/a^2+y^2/b^2=1\\), фокусів \\((\\pm c,0)\\), відповідні директриси:</p>
<div class="math">\\[x=\\pm\\frac{a}{e}=\\pm\\frac{a^2}{c}.\\]</div>
<p>Спряжені діаметри еліпса — діаметри, кожен із яких паралельний дотичним у кінцях іншого. Для еліпса з півосями \\(a,b\\), якщо нахили спряжених діаметрів \\(k_1,k_2\\) скінченні, виконується</p>
<div class="math">\\[\\boxed{k_1k_2=-\\frac{b^2}{a^2}.}\\]</div>
<p>У граничних випадках вертикального діаметра нахил не визначений, тому співвідношення записують у відповідній параметричній або векторній формі.</p>`
    }]
  },
  {
    topic: "8. Дотична до кривої другого порядку",
    notes: [{
      title: "Рівняння дотичної",
      html: `<p>Дотична в точці кривої — граничне положення січної, коли друга точка перетину наближається до першої. Для коніки, заданої рівнянням \\(F(x,y)=0\\), у регулярній точці \\((x_0,y_0)\\), де градієнт не нульовий, рівняння дотичної:</p>
<div class="math">\\[F_x(x_0,y_0)(x-x_0)+F_y(x_0,y_0)(y-y_0)=0.\\]</div>
<p>Для еліпса:</p>
<div class="math">\\[\\frac{x_0x}{a^2}+\\frac{y_0y}{b^2}=1.\\]</div>
<p>Для гіперболи \\(x^2/a^2-y^2/b^2=1\\):</p>
<div class="math">\\[\\frac{x_0x}{a^2}-\\frac{y_0y}{b^2}=1.\\]</div>
<p>Для параболи \\(y^2=2px\\):</p>
<div class="math">\\[yy_0=p(x+x_0).\\]</div>
<p>Ці формули застосовують лише в точці, що належить відповідній кривій.</p>`
    }]
  },
  {
    topic: "9. Перестановка, підстановка, інверсна пара",
    notes: [{
      title: "Перестановки та підстановки",
      html: `<p><b>Перестановка</b> множини \\(\\{1,\\ldots,n\\}\\) — бієкція цієї множини на себе. Її можна записати двома рядками:</p>
<div class="math">\\[\\sigma=\\begin{pmatrix}1&2&\\cdots&n\\\\\\sigma(1)&\\sigma(2)&\\cdots&\\sigma(n)\\end{pmatrix}.\\]</div>
<p>Підстановка — інша назва перестановки як взаємно однозначного перетворення елементів. Добуток підстановок означає композицію.</p>
<p>Подвійна підстановка — цикл довжини два, або транспозиція:</p>
<div class="math">\\[(i\\ j),\\]</div>
<p>яка міняє місцями \\(i,j\\), а решту елементів залишає на місці.</p>
<p><b>Інверсія</b> — пара індексів \\(i<j\\), для якої \\(\\sigma(i)>\\sigma(j)\\). Кількість інверсій:</p>
<div class="math">\\[I(\\sigma)=\\#\\{(i,j):i<j,\\ \\sigma(i)>\\sigma(j)\\}.\\]</div>`
    }]
  },
  {
    topic: "10. Парність перестановки. Розклад у транспозиції",
    notes: [{
      title: "Парність перестановки",
      html: `<p>Перестановка парна, якщо кількість її інверсій парна, і непарна — якщо непарна. Знак:</p>
<div class="math">\\[\\operatorname{sgn}(\\sigma)=(-1)^{I(\\sigma)}.\\]</div>
<p><b>Твердження.</b> Кожну перестановку можна подати як добуток транспозицій. Парність числа транспозицій у такому розкладі не залежить від вибраного розкладу.</p>
<p>Наслідки: знак добутку дорівнює добутку знаків; транспозиція має знак \\(-1\\); циклу довжини \\(k\\) відповідає знак \\((-1)^{k-1}\\).</p>
<div class="math">\\[\\operatorname{sgn}(\\sigma\\tau)=\\operatorname{sgn}(\\sigma)\\operatorname{sgn}(\\tau).\\]</div>
<p>Ідея доведення інваріантності парності: одна транспозиція змінює знак перестановки, тобто парність кількості інверсій; тому будь-який розклад у транспозиції має однакову парність довжини.</p>`
    }]
  },
  {
    topic: "11. Індуктивне означення визначника",
    notes: [{
      title: "Означення визначника",
      html: `<p>Для матриці \\(A=(a_{ij})\\) порядку \\(n\\) визначник задають рекурсивно. Для \\(n=1\\): \\(\\det(a_{11})=a_{11}\\). Для \\(n\\ge2\\), розклад за першим рядком:</p>
<div class="math">\\[\\det A=\\sum_{j=1}^{n}(-1)^{1+j}a_{1j}M_{1j},\\]</div>
<p>де \\(M_{ij}\\) — мінор елемента \\(a_{ij}\\), тобто визначник матриці, отриманої викресленням \\(i\\)-го рядка та \\(j\\)-го стовпчика.</p>
<p>Алгебраїчне доповнення:</p>
<div class="math">\\[A_{ij}=(-1)^{i+j}M_{ij}.\\]</div>
<p>Тому розклад за будь-яким рядком \\(i\\):</p>
<div class="math">\\[\\det A=\\sum_{j=1}^{n}a_{ij}A_{ij},\\]</div>
<p>а за стовпчиком \\(j\\):</p>
<div class="math">\\[\\det A=\\sum_{i=1}^{n}a_{ij}A_{ij}.\\]</div>
<p>Для матриці \\(2\\times2\\):</p>
<div class="math">\\[\\begin{vmatrix}a&b\\\\c&d\\end{vmatrix}=ad-bc.\\]</div>`
    }]
  },
  {
    topic: "12. Властивості визначників. Визначник суми матриць",
    notes: [{
      title: "Властивості визначників",
      html: `<p>Основні властивості:</p>
<ol>
<li>Якщо рядок або стовпчик нульовий, визначник дорівнює нулю.</li>
<li>Множення одного рядка на \\(\\lambda\\) множить визначник на \\(\\lambda\\).</li>
<li>Перестановка двох рядків змінює знак визначника.</li>
<li>Додавання до рядка кратного іншого рядка не змінює визначник.</li>
<li>Якщо два рядки однакові або пропорційні, визначник нульовий.</li>
<li>Визначник лінійний за кожним рядком окремо.</li>
</ol>
<p>Для матриць \\(A,B\\) однакового порядку загалом</p>
<div class="math">\\[\\det(A+B)\\ne\\det A+\\det B.\\]</div>
<p>Але за мультилінійністю визначник суми можна розкласти як суму \\(2^n\\) визначників, отриманих вибором для кожного рядка рядка з \\(A\\) або з \\(B\\). Для \\(2\\times2\\):</p>
<div class="math">\\[\\det(A+B)=\\det A+\\det B+\\det(\\text{рядки }A_1,B_2)+\\det(\\text{рядки }B_1,A_2).\\]</div>
<p>Якщо \\(A,B\\) — діагональні матриці, то \\(\\det(A+B)\\) є добутком сум відповідних діагональних елементів.</p>`
    }]
  },
  {
    topic: "13. Транспонування матриці",
    notes: [{
      title: "Транспонування",
      html: `<p>Транспонована матриця \\(A^T\\) утворюється заміною рядків стовпчиками:</p>
<div class="math">\\[(A^T)_{ij}=a_{ji}.\\]</div>
<p>Головна властивість:</p>
<div class="math">\\[\\boxed{\\det(A^T)=\\det A.}\\]</div>
<p>Отже, усі властивості визначника, сформульовані для рядків, мають відповідні аналоги для стовпчиків. Також \\((AB)^T=B^TA^T\\), \\((A^T)^T=A\\).</p>`
    }]
  },
  {
    topic: "14. Мінори, алгебраїчні доповнення, ранг матриці",
    notes: [{
      title: "Мінори та ранг",
      html: `<p>Мінор порядку \\(k\\) — визначник квадратної підматриці, утвореної вибором \\(k\\) рядків і \\(k\\) стовпчиків. Ранг матриці \\(A\\), позначення \\(\\operatorname{rank}A\\), — найбільший порядок її ненульового мінора.</p>
<p>Еквівалентно, ранг — максимальна кількість лінійно незалежних рядків (або стовпчиків). Основні факти:</p>
<div class="math">\\[0\\le\\operatorname{rank}A\\le\\min(m,n)\\quad(A\\in M_{m\\times n}).\\]</div>
<p>Ранг не змінюється під час елементарних перетворень рядків або стовпчиків. Ненульовий мінор порядку \\(k\\) гарантує \\(\\operatorname{rank}A\\ge k\\); якщо всі мінори порядку \\(k+1\\) нульові, то ранг не більший за \\(k\\).</p>`
    }]
  },
  {
    topic: "15. Визначник верхньої трикутної матриці",
    notes: [{
      title: "Трикутна матриця",
      html: `<p>Верхня трикутна матриця має нулі нижче головної діагоналі:</p>
<div class="math">\\[A=\\begin{pmatrix}a_{11}&*&\\cdots&*\\\\0&a_{22}&\\cdots&*\\\\\\vdots&\\ddots&\\ddots&\\vdots\\\\0&\\cdots&0&a_{nn}\\end{pmatrix}.\\]</div>
<p><b>Теорема.</b></p>
<div class="math">\\[\\boxed{\\det A=a_{11}a_{22}\\cdots a_{nn}.}\\]</div>
<p>Доведення за індукцією: розкладаємо визначник за першим стовпчиком. У ньому лише один потенційно ненульовий елемент \\(a_{11}\\), тому \\(\\det A=a_{11}\\det A_1\\), де \\(A_1\\) — трикутна матриця порядку \\(n-1\\). Застосовуємо припущення індукції.</p>
<p>Для нижньої трикутної матриці твердження таке саме.</p>`
    }]
  },
  {
    topic: "16. Лема про нульову суму алгебраїчних доповнень",
    notes: [{
      title: "Базові детермінантні тотожності",
      html: `<p>Нехай \\(A_{ij}\\) — алгебраїчні доповнення елементів матриці. Для різних рядків \\(i\\ne k\\):</p>
<div class="math">\\[\\sum_{j=1}^{n}a_{kj}A_{ij}=0.\\]</div>
<p>Для \\(i=k\\) ця сума дорівнює \\(\\det A\\):</p>
<div class="math">\\[\\sum_{j=1}^{n}a_{ij}A_{ij}=\\det A.\\]</div>
<p>Аналогічні тотожності виконуються для стовпчиків. Обґрунтування: сума з різними індексами є визначником матриці, в якій один рядок замінено іншим уже наявним рядком; така матриця має два однакові рядки, отже її визначник нульовий.</p>
<p>Ці рівності називають базовими детермінантними тотожностями. Вони використовуються, зокрема, під час доведення формул оберненої матриці.</p>`
    }]
  },
  {
    topic: "17. Лінійна комбінація та лінійна залежність",
    notes: [{
      title: "Лінійна залежність рядків",
      html: `<p>Лінійна комбінація векторів \\(v_1,\\ldots,v_k\\):</p>
<div class="math">\\[\\lambda_1v_1+\\cdots+\\lambda_kv_k.\\]</div>
<p>Система векторів лінійно залежна, якщо існують коефіцієнти, не всі нульові, для яких</p>
<div class="math">\\[\\lambda_1v_1+\\cdots+\\lambda_kv_k=0.\\]</div>
<p>Якщо така рівність можлива лише за \\(\\lambda_1=\\cdots=\\lambda_k=0\\), система лінійно незалежна.</p>
<p>Рядки матриці розглядають як вектори однакової довжини; аналогічно — стовпчики. Для квадратної матриці:</p>
<div class="math">\\[\\det A\\ne0\\iff \\text{рядки (стовпчики) лінійно незалежні}.\\]</div>
<p>Доведення: \\(\\det A=0\\) тоді й тільки тоді, коли стовпчики лінійно залежні. Якщо один стовпчик є лінійною комбінацією інших, мультилінійність і властивість нульового визначника при однакових стовпчиках дають нуль. Обернений напрям випливає з критерію оборотності матриці або теореми про ранг.</p>`
    }]
  },
  {
    topic: "18. Алгоритм Гауса для визначника та рангу",
    notes: [{
      title: "Алгоритм Гауса",
      html: `<p>Елементарні перетворення рядків:</p>
<ul>
<li>перестановка двох рядків — змінює знак визначника;</li>
<li>множення рядка на ненульове число — множить визначник на це число;</li>
<li>додавання до рядка кратного іншого рядка — не змінює визначник.</li>
</ul>
<p><b>Обчислення визначника.</b> Перетворити матрицю до трикутного вигляду. Врахувати всі перестановки та множники рядків. Тоді визначник — добуток діагональних елементів з урахуванням цих змін.</p>
<p><b>Обчислення рангу.</b> Виконувати елементарні перетворення, доки матриця не набуде східчастого вигляду. Кількість ненульових рядків дорівнює рангу.</p>
<p>Алгоритм:</p>
<ol>
<li>Вибрати ненульовий опорний елемент у поточному стовпчику.</li>
<li>За потреби переставити рядки, щоб поставити його на опорну позицію.</li>
<li>Занулити елементи під опорним за допомогою додавання кратних рядків.</li>
<li>Перейти до підматриці праворуч і нижче.</li>
<li>Порахувати ненульові рядки або перемножити діагональні елементи з поправкою на перетворення.</li>
</ol>`
    }]
  },
  {
    topic: "19. Визначник добутку матриць",
    notes: [{
      title: "Визначник добутку",
      html: `<p>Для квадратних матриць \\(A,B\\) одного порядку:</p>
<div class="math">\\[\\boxed{\\det(AB)=\\det A\\cdot\\det B.}\\]</div>
<p>Наслідки: матриця \\(A\\) оборотна тоді й тільки тоді, коли \\(\\det A\\ne0\\); \\(\\det I=1\\); якщо \\(A\\) оборотна, то</p>
<div class="math">\\[\\det(A^{-1})=\\frac1{\\det A}.\\]</div>
<p>Також \\(\\det(A^k)=(\\det A)^k\\) для натурального \\(k\\).</p>`
    }]
  },
  {
    topic: "20. Ранг при множенні на невироджену матрицю",
    notes: [{
      title: "Ранг і невироджені матриці",
      html: `<p>Якщо \\(P\\) — невироджена квадратна матриця відповідного розміру, то</p>
<div class="math">\\[\\operatorname{rank}(PA)=\\operatorname{rank}A,\\qquad \\operatorname{rank}(AQ)=\\operatorname{rank}A\\]</div>
<p>для невиродженої \\(Q\\). Множення зліва відповідає оборотній комбінації рядків, справа — оборотній комбінації стовпчиків; тому лінійний ранг не змінюється.</p>
<p>Якщо \\(\\operatorname{rank}A=k\\), то існує хоча б один ненульовий мінор порядку \\(k\\), а всі мінори порядку \\(k+1\\) дорівнюють нулю. Усі мінори порядку \\(k\\) не обов'язково ненульові — достатньо існування одного ненульового.</p>`
    }]
  },
  {
    topic: "21. Матриця та розширена матриця системи",
    notes: [{
      title: "Матриця системи",
      html: `<p>Система \\(m\\) лінійних рівнянь із \\(n\\) невідомими:</p>
<div class="math">\\[\\begin{cases}a_{11}x_1+\\cdots+a_{1n}x_n=b_1\\\\\\vdots\\\\a_{m1}x_1+\\cdots+a_{mn}x_n=b_m.\\end{cases}\\]</div>
<p>Матричний запис:</p>
<div class="math">\\[Ax=b,\\]</div>
<p>де \\(A=(a_{ij})\\) — матриця системи, \\(x=(x_1,\\ldots,x_n)^T\\) — стовпчик невідомих, \\(b=(b_1,\\ldots,b_m)^T\\) — стовпчик вільних членів.</p>
<p>Розширена матриця:</p>
<div class="math">\\[(A|b)=\\begin{pmatrix}a_{11}&\\cdots&a_{1n}&b_1\\\\\\vdots&&\\vdots&\\vdots\\\\a_{m1}&\\cdots&a_{mn}&b_m\\end{pmatrix}.\\]</div>`
    }]
  },
  {
    topic: "22. Теорема Кронекера—Капеллі",
    notes: [{
      title: "Кронекер—Капеллі",
      html: `<p><b>Теорема.</b> Система \\(Ax=b\\) сумісна тоді й тільки тоді, коли</p>
<div class="math">\\[\\boxed{\\operatorname{rank}A=\\operatorname{rank}(A|b).}\\]</div>
<p>Якщо ранги різні — система несумісна. Якщо система сумісна і ранг дорівнює числу невідомих \\(n\\), розв'язок єдиний. Якщо ранг \\(r<n\\), існує \\(n-r\\) вільних параметрів і нескінченно багато розв'язків.</p>
<p>Практичний алгоритм: скласти розширену матрицю, привести її до східчастого вигляду методом Гауса, порівняти кількість опорних позицій у матриці коефіцієнтів і розширеній матриці. Рядок виду \\(0\\ \\cdots\\ 0\\,|\\,c\\), \\(c\\ne0\\), означає суперечність.</p>`
    }]
  },
  {
    topic: "23. Теорема Крамера",
    notes: [{
      title: "Крамер",
      html: `<p>Для квадратної системи \\(Ax=b\\), якщо \\(\\Delta=\\det A\\ne0\\), система має єдиний розв'язок:</p>
<div class="math">\\[x_i=\\frac{\\Delta_i}{\\Delta},\\]</div>
<p>де \\(\\Delta_i\\) — визначник, отриманий заміною \\(i\\)-го стовпчика матриці \\(A\\) стовпчиком \\(b\\).</p>
<p><b>Доведення достатності.</b> За формулами алгебраїчних доповнень можна побудувати матрицю \\(A^{-1}\\), оскільки \\(\\det A\\ne0\\). Тоді \\(x=A^{-1}b\\), отже розв'язок існує і єдиний. Розписавши координати через доповнення, отримуємо формули Крамера.</p>
<p>Якщо \\(\\det A=0\\), формули Крамера в такому вигляді не застосовуються; систему досліджують за теоремою Кронекера—Капеллі або методом Гауса.</p>`
    }]
  },
  {
    topic: "24. Розв'язок, загальний розв'язок, ФСР",
    notes: [{
      title: "ФСР",
      html: `<p>Однорідна система має вигляд \\(Ax=0\\). Вона завжди має нульовий розв'язок \\(x=0\\). Множина всіх розв'язків є лінійним підпростором \\(\\ker A\\).</p>
<p>Загальний розв'язок — опис усіх розв'язків через вільні параметри. Фундаментальна система розв'язків (ФСР) — базис простору розв'язків однорідної системи. Кожний розв'язок однозначно подається як лінійна комбінація векторів ФСР.</p>

const STORAGE_KEY = "algebra_notes_v3";
let data;

function load() {
  const saved = localStorage.getItem(STORAGE_KEY);
  data = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

const container = document.getElementById("container");
const searchInput = document.getElementById("search");
const modalBg = document.getElementById("modalBg");
const topicSelect = document.getElementById("topicSelect");
const noteTitle = document.getElementById("noteTitle");
const noteBody = document.getElementById("noteBody");
const progressFill = document.getElementById("progressFill");
const stats = document.getElementById("stats");

let query = "";

function stripHtml(html) {
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || "";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

function highlightText(text, q) {
  if (!q) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const re = new RegExp("(" + escapeRegex(escapeHtml(q)) + ")", "gi");
  return escaped.replace(re, "<mark>$1</mark>");
}

function renderMathJax() {
  if (window.MathJax && window.MathJax.typesetPromise) {
    MathJax.typesetPromise().catch(err => console.warn("MathJax:", err));
  } else {
    // якщо MathJax ще не завантажився — спробуємо пізніше
    setTimeout(renderMathJax, 300);
  }
}

function render() {
  const q = query.trim().toLowerCase();
  let html = "";
  let totalFound = 0;
  let totalNotes = 0;

  data.forEach((topic, ti) => {
    totalNotes += topic.notes.length;
    const matchedNotes = topic.notes.filter(n => {
      if (!q) return true;
      const searchable = (topic.topic + " " + n.title + " " + stripHtml(n.html)).toLowerCase();
      return searchable.includes(q);
    });
    if (q && matchedNotes.length === 0) return;
    totalFound += matchedNotes.length;

    html += `<div class="topic${q ? " open" : ""}" data-ti="${ti}">
      <div class="topic-header" onclick="toggleTopic(${ti})">
        <span class="chevron">▶</span>
        <span class="topic-title">${highlightText(topic.topic, q)}</span>
        <span style="color:var(--muted);font-size:.8rem">${topic.notes.length}</span>
      </div>
      <div class="notes">`;

    if (matchedNotes.length === 0) {
      html += `<div class="empty">Поки що порожньо</div>`;
    } else {
      matchedNotes.forEach((n) => {
        const realIndex = topic.notes.indexOf(n);
        html += `<div class="note">
          <button class="note-del" onclick="deleteNote(${ti}, ${realIndex}, event)">✕</button>
          <h3>${highlightText(n.title, q)}</h3>
          <div class="note-body">${n.html}</div>
        </div>`;
      });
    }
    html += `</div></div>`;
  });

  if (q && totalFound === 0) {
    html = `<div class="empty">Нічого не знайдено за запитом «${escapeHtml(query)}»</div>`;
  }
  container.innerHTML = html;

  const openCount = container.querySelectorAll(".topic.open").length;
  const totalTopics = data.length;
  progressFill.style.width = totalTopics ? (openCount / totalTopics * 100) + "%" : "0%";
  stats.textContent = `Тем: ${totalTopics} · Карток: ${totalNotes}` + (q ? ` · Знайдено: ${totalFound}` : "");

  renderMathJax();
}

window.toggleTopic = function(i) {
  const el = container.querySelector(`.topic[data-ti="${i}"]`);
  if (el) {
    el.classList.toggle("open");
    const openCount = container.querySelectorAll(".topic.open").length;
    progressFill.style.width = data.length ? (openCount / data.length * 100) + "%" : "0%";
  }
};

window.deleteNote = function(ti, ni, e) {
  e.stopPropagation();
  if (!confirm("Видалити цю картку?")) return;
  data[ti].notes.splice(ni, 1);
  save();
  render();
};

let searchTimer;
searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    query = searchInput.value;
    render();
  }, 200);
});

document.getElementById("printBtn").addEventListener("click", () => {
  // Відкриваємо всі теми перед друком
  document.querySelectorAll(".topic").forEach(el => el.classList.add("open"));
  setTimeout(() => window.print(), 300);
});

document.getElementById("fab").addEventListener("click", () => {
  topicSelect.innerHTML = data.map((t, i) => `<option value="${i}">${escapeHtml(t.topic)}</option>`).join("");
  noteTitle.value = "";
  noteBody.value = "";
  modalBg.classList.add("show");
  noteTitle.focus();
});

document.getElementById("cancelBtn").addEventListener("click", () => modalBg.classList.remove("show"));
modalBg.addEventListener("click", (e) => { if (e.target === modalBg) modalBg.classList.remove("show"); });

document.getElementById("saveBtn").addEventListener("click", () => {
  const ti = +topicSelect.value;
  const title = noteTitle.value.trim();
  const body = noteBody.value.trim();
  if (!title || !body) { alert("Заповни заголовок і текст"); return; }
  // Перетворюємо переноси рядків у <br>, якщо користувач не ввів HTML
  let html = body;
  if (!/[<>]/.test(body)) {
    html = escapeHtml(body).replace(/\n/g, "<br>");
  }
  data[ti].notes.push({ title, html });
  save();
  modalBg.classList.remove("show");
  render();
});

load();
render();
</script>
</body>
</html>
